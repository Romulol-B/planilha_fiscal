name: Testes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: python -m unittest discover -s tests -v
        env:
          REQUIRE_LIBREOFFICE: '1'
      - name: Validar roteiro de demonstração
        run: |
          python -m velas_notas_fiscais exemplos/nota_2_xml.xml --saida saidas/demo --centro-custo 'Conta  a pagar'
          python -m velas_sheets auditar-modelo --xlsx exemplos/modelo-demonstracao.xlsx
